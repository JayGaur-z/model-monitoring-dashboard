<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MLOps Sentinel — Model Monitoring Platform{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-canvas: #090d16;
            --bg-surface: #0f172a;
            --bg-card: #131c31;
            --bg-card-hover: #17233d;
            --border-subtle: #1e293b;
            --border-medium: #2e3c54;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --success-green: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --warning-amber: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --danger-rose: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --purple-mlops: #8b5cf6;
            --purple-bg: rgba(139, 92, 246, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Navigation Header */
        .top-nav {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.85rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
        }

        .brand-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text-main);
            background-color: var(--border-subtle);
        }

        .system-status-pill {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 9999px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--success-green);
            box-shadow: 0 0 6px var(--success-green);
        }

        /* Main Container */
        .app-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.55rem 1.15rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #1e293b;
            color: var(--text-main);
            border-color: var(--border-medium);
        }

        .btn-secondary:hover {
            background-color: #27354d;
            border-color: #3b82f6;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border-subtle);
        }

        .btn-outline:hover {
            color: var(--text-main);
            background: var(--bg-card);
            border-color: var(--border-medium);
        }

        /* Enterprise Cards */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
            transition: border-color 0.15s ease;
        }

        .card:hover {
            border-color: var(--border-medium);
        }

        /* Stat KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        .kpi-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.1;
            font-family: 'JetBrains Mono', monospace;
        }

        .kpi-subtext {
            font-size: 0.75rem;
            color: var(--text-faint);
            margin-top: 0.4rem;
        }

        /* Status Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .badge-success {
            background-color: var(--success-bg);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-warning {
            background-color: var(--warning-bg);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-danger {
            background-color: var(--danger-bg);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-info {
            background-color: var(--accent-glow);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Modern Tables */
        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--bg-card);
        }

        table.enterprise-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        table.enterprise-table th {
            background-color: #0b1324;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid var(--border-medium);
        }

        table.enterprise-table td {
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-main);
            vertical-align: middle;
        }

        table.enterprise-table tr:last-child td {
            border-bottom: none;
        }

        table.enterprise-table tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Alerts & Banners */
        .alert-banner {
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            border: 1px solid transparent;
        }

        .alert-banner.warning {
            background-color: rgba(245, 158, 11, 0.08);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fde68a;
        }

        .alert-banner.danger {
            background-color: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-banner.info {
            background-color: rgba(59, 130, 246, 0.08);
            border-color: rgba(59, 130, 246, 0.3);
            color: #bfdbfe;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.825rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            width: 100%;
            background-color: #0b1324;
            border: 1px solid var(--border-medium);
            border-radius: 6px;
            padding: 0.6rem 0.85rem;
            color: var(--text-main);
            font-size: 0.875rem;
            font-family: inherit;
            transition: all 0.15s ease;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-subtle);
            padding: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-faint);
            background: #060911;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-faint);
            margin-bottom: 1rem;
        }

        .breadcrumbs a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .breadcrumbs a:hover {
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .nav-inner {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            .app-container {
                padding: 1.25rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="nav-inner">
            <div class="brand-group">
                <a href="{% url 'dashboard' %}" class="brand-logo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-blue);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>MLOps Sentinel</span>
                    <span class="brand-badge">Monitoring</span>
                </a>
                <div class="nav-links">
                    <a href="{% url 'dashboard' %}" class="nav-link">Model Registry</a>
                    <a href="{% url 'build_model' %}" class="nav-link">+ Deploy Model</a>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="system-status-pill">
                    <span class="status-dot"></span>
                    <span>Monitoring Daemon Active</span>
                </div>
            </div>
        </div>
    </header>

    <main class="app-container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: gap; gap: 1rem;">
            <span>PS4 College Project &mdash; Model Monitoring Dashboard</span>
            <span>Enterprise MLOps &bull; Kolmogorov-Smirnov & Chi-Square Drift Diagnostics</span>
        </div>
    </footer>
</body>
</html>
